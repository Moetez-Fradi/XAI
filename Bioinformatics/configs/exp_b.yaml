# Experiment B — attribution validity vs DSSP-derived structural features.

# Prefer micromamba bio-tools mkdssp; override with absolute path if needed.
mkdssp_bin: tools/mamba/envs/bio-tools/bin/mkdssp

annotations_dir: data/annotations/dssp
features_table: data/annotations/dssp_chain_features.csv

# Dim↔feature map is fit on train chains only (never holdout).
n_train_for_map: 3000
map_random_seed: 42

# Pairs come from Exp A checkpoints (top neighbors with dims_explained).
exp_a_jsonl: results/exp_a/checkpoints/queries.jsonl
exp_a_smoke_jsonl: results/exp_a_smoke/checkpoints/queries.jsonl
max_neighbors_per_query: 5          # use top-5 attributed neighbors
min_attribution_mass: 1e-6

n_permutations: 1000
permutation_seed: 42

results_dir: results/exp_b
smoke_results_dir: results/exp_b_smoke

# Feature columns (protein-level aggregates from per-residue DSSP / structure)
features:
  - frac_helix
  - frac_sheet
  - frac_coil
  - mean_hydrophobicity
  - mean_rsa
  - mean_b_factor
